<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>የዲዛይን ትዕዛዝ መቀበያ</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #0ea5e9;
      --telebirr-orange: #f97316;
      --text-color: #f8fafc;
      --border-color: #334155;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    .app-container {
      width: 100%;
      max-width: 420px;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header h2 {
      margin: 0;
      color: var(--accent-color);
    }

    .header p {
      font-size: 13px;
      color: #94a3b8;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 14px;
      margin-bottom: 6px;
      font-weight: 600;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: var(--card-bg);
      color: white;
      box-sizing: border-box;
      font-size: 14px;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent-color);
    }

    .telebirr-box {
      background: rgba(249, 115, 22, 0.1);
      border: 1px solid var(--telebirr-orange);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 16px;
    }

    .telebirr-title {
      color: var(--telebirr-orange);
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 6px;
    }

    .submit-btn {
      width: 100%;
      background-color: var(--accent-color);
      color: white;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .submit-btn:hover {
      opacity: 0.9;
    }

    .status-msg {
      text-align: center;
      margin-top: 10px;
      font-size: 14px;
      display: none;
    }
  </style>
</head>
<body>

<div class="app-container">
  <div class="header">
    <h2>ጃራ ግራፊክስ እና ዲዛይን - የህትመት እና ዲዛይን ትዕዛዝ</h2>
    <p>እባክዎ የሚፈልጉትን የዲዛይን አይነት እና መረጃ ያስገቡ</p>
  </div>

  <form id="orderForm">
    <div class="form-group">
      <label>የዲዛይን አይነት</label>
      <select id="serviceType" required>
        <option value="">ይምረጡ...</option>
        <option value="የቢዝነስ ካርድ">የቢዝነስ ካርድ (Business Card)</option>
        <option value="ፖስተር / ባነር">ፖስተር / ባነር (Poster / Banner)</option>
        <option value="የሶሻል ሚዲያ ፖስት">የሶሻል ሚዲያ ፖስት (Social Media Post)</option>
        <option value="ብሮሹር / ፍላየር">ብሮሸር / ፍላየር (Brochure / Flyer)</option>
        <option value="ቪዲዮ / ቪዲዮ">ቪዲዮ ኤዲትንግ / Video Editing)</option>
        <option value="ሌላ">ሌላ የህትመት ስራ</option>
      </select>
    </div>

    <div class="form-group">
      <label>የደንበኛው/የድርጅቱ ስም እና ስልክ</label>
      <input type="text" id="clientName" placeholder="ለምሳሌ፡ አበበ - 0911XXXXXX" required>
    </div>

    <div class="form-group">
      <label>የዲዛይኑ ዝርዝር መግለጫ</label>
      <textarea id="description" rows="3" placeholder="ስለ ዲዛይኑ ማብራሪያ፣ የጽሁፍ ይዘት እና ቀለሞች ያስገቡ..." required></textarea>
    </div>

    <!-- የቴሌብር ክፍያ ክፍል -->
    <div class="telebirr-box">
      <div class="telebirr-title">💳 የቴሌብር ክፍያ መመሪያ</div>
      <p style="font-size: 12px; margin: 4px 0;"> ውድ ደንበኛችን እባክዎን የቅድመ ክፍያ <b>100 ብር</b> በቴሌብር ቁጥር <b>0908709631</b> ይላኩ።</p>
    </div>

    <div class="form-group">
      <label>የቴሌብር Transaction ID እና Screenshot (የክፍያ ማረጋገጫ ፎቶ)</label>
      <input type="text" id="telebirrId" placeholder="Transaction ID ያስገቡ" required style="margin-bottom: 8px;">
      <input type="file" id="paymentScreenshot" accept="image/*" required style="padding: 8px; font-size: 13px;">
    </div>

    <button type="submit" id="submitBtn" class="submit-btn">/send ይላኩ</button>
    <div id="statusMsg" class="status-msg"></div>
  </form>
</div>

<script>
  const tg = window.Telegram.WebApp;
  tg.expand();

  // ***** እዚህ ቦታ ላይ ያንተን መረጃዎች ተካ *****
  const BOT_TOKEN = "8623927575:AAHiRtZbBY4lyLfkZ_FUW-pdA635lpafC2Y";
  const MY_CHAT_ID = "6109704660"; // በ @userinfobot ያገኘኸውን Chat ID ቁጥር እዚህ አስገባ

  document.getElementById('orderForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const submitBtn = document.getElementById('submitBtn');
    const statusMsg = document.getElementById('statusMsg');

    submitBtn.innerText = "እየተላከ ነው...";
    submitBtn.disabled = true;

    const service = document.getElementById('serviceType').value;
    const client = document.getElementById('clientName').value;
    const details = document.getElementById('description').value;
    const txId = document.getElementById('telebirrId').value;
    const screenshotFile = document.getElementById('paymentScreenshot').files[0];

    const message = `
/send
📌 <b>አዲስ የዲዛይን ትዕዛዝ ደርሷል!</b>

🏢 <b>ድርጅት:</b> ጃራ ግራፊክስ እና ዲዛይን
🎨 <b>የዲዛይን አይነት:</b> ${service}
👤 <b>ደንበኛ/ስልክ:</b> ${client}
📝 <b>ዝርዝር መግለጫ:</b> ${details}
💳 <b>Telebirr TxID:</b> <code>${txId}</code>
    `;

    try {
      // 1. የጽሁፍ መልዕክቱን መጀመሪያ መላክ
      const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          chat_id: MY_CHAT_ID,
          text: message,
          parse_mode: 'HTML'
        })
      });

      if (!response.ok) throw new Error("Text send failed");

      // 2. የክፍያ ስክሪንሾት ፎቶውን መላክ (ካለ)
      if (screenshotFile) {
        const formData = new FormData();
        formData.append('chat_id', MY_CHAT_ID);
        formData.append('photo', screenshotFile);
        formData.append('caption', `📸 የ ${client} የቴሌብር ክፍያ ስክሪንሾት (TxID: ${txId})`);

        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
          method: 'POST',
          body: formData
        });
      }

      statusMsg.style.color = "#4ade80";
      statusMsg.innerText = "ትዕዛዝዎ በተሳካ ሁኔታ ተልኳል! ለደንበኝነትዎ እናመሰግናለን።";
      statusMsg.style.display = "block";
      setTimeout(() => {
        tg.close();
      }, 2000);

    } catch (error) {
      statusMsg.style.color = "#f87171";
      statusMsg.innerText = "እባክዎ እንደገና ይሞክሩ።";
      statusMsg.style.display = "block";
      submitBtn.innerText = "send / ይላኩ";
      submitBtn.disabled = false;
    }
  });
</script>

</body>
</html>
