<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>የዲዛይን ትዕዛዝ መቀበያ</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #0ea5e9;
      --telebirr-orange: #f97316;
      --text-color: #f8fafc;
      --border-color: #334155;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    .app-container {
      width: 100%;
      max-width: 420px;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header h2 {
      margin: 0;
      color: var(--accent-color);
    }

    .header p {
      font-size: 13px;
      color: #94a3b8;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 14px;
      margin-bottom: 6px;
      font-weight: 600;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: var(--card-bg);
      color: white;
      box-sizing: border-box;
      font-size: 14px;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent-color);
    }

    .telebirr-box {
      background: rgba(249, 115, 22, 0.1);
      border: 1px solid var(--telebirr-orange);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 16px;
    }

    .telebirr-title {
      color: var(--telebirr-orange);
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 6px;
    }

    .submit-btn {
      width: 100%;
      background-color: var(--accent-color);
      color: white;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .submit-btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

<div class="app-container">
  <div class="header">
    <h2>የህትመት እና ዲዛይን ትዕዛዝ</h2>
    <p>የሚፈልጉትን የዲዛይን አይነት እና መረጃ ያስገቡ</p>
  </div>

  <form id="orderForm">
    <div class="form-group">
      <label>የዲዛይን አይነት</label>
      <select id="serviceType" required>
        <option value="">ይምረጡ...</option>
        <option value="የቢዝነስ ካርድ">የቢዝነስ ካርድ (Business Card)</option>
        <option value="ፖስተር / ባነር">ፖስተር / ባነር (Poster / Banner)</option>
        <option value="የሶሻል ሚዲያ ፖስት">የሶሻል ሚዲያ ፖስት (Social Media Post)</option>
        <option value="ብሮሹር / ፍላየር">ብሮሹር / ፍላየር (Brochure / Flyer)</option>
        <option value="ሌላ">ሌላ የህትመት ስራ</option>
      </select>
    </div>

    <div class="form-group">
      <label>የስራው/ድርጅቱ ስም እና ስልክ</label>
      <input type="text" id="clientName" placeholder="ለምሳሌ፡ አበበ - 0911XXXXXX" required>
    </div>

    <div class="form-group">
      <label>የዲዛይኑ ዝርዝር መግለጫ</label>
      <textarea id="description" rows="3" placeholder="ስለ ዲዛይኑ ማብራሪያ፣ የጽሁፍ ይዘት እና ቀለሞች ያስገቡ..." required></textarea>
    </div>

    <!-- የቴሌብር ክፍያ ክፍል -->
    <div class="telebirr-box">
      <div class="telebirr-title">💳 የቴሌብር ክፍያ መመሪያ</div>
      <p style="font-size: 12px; margin: 4px 0;">እባክዎን የቅድመ ክፍያ <b>100 ብር</b> በቴሌብር ቁጥር <b>09XXXXXXXX</b> ይላኩ።</p>
    </div>

    <div class="form-group">
      <label>የቴሌብር Transaction ID</label>
      <input type="text" id="telebirrId" placeholder="ለምሳሌ፡ 9AB12CD3" required>
    </div>

    <button type="submit" class="submit-btn">ትዕዛዝ አስተላልፍ</button>
  </form>
</div>

<script>
  const tg = window.Telegram.WebApp;
  tg.expand(); // ሚኒ አፑን ሙሉ ስክሪን ያደርገዋል

  document.getElementById('orderForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const data = {
      service: document.getElementById('serviceType').value,
      client: document.getElementById('clientName').value,
      details: document.getElementById('description').value,
      txId: document.getElementById('telebirrId').value
    };

    // መረጃውን ወደ ቴሌግራም ቦት ይልካል
    tg.sendData(JSON.stringify(data));
    tg.close();
  });
</script>

</body>
</html>
